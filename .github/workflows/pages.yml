# Publishes the site folder to GitHub Pages on every push to main.
#
# Pages can only serve a branch root or a /docs folder when deploying from a
# branch, and the site lives in site/ because that is the folder you copy to
# any host. So this uploads site/ as the Pages artifact instead, which keeps
# the repository laid out the way the README describes.
#
# Everything the page needs is relative (lookup.js, lookup.css, data/*.json),
# so it works unchanged under a project subpath such as /vote-gr/ as well as
# at the root of a custom domain.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, so a run is not canceled halfway
# through replacing the live files.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, upload then deploy, not one. deploy-pages looks the artifact up by
# name, and run straight after the upload in the same job that lookup can come
# back empty for an artifact finalized half a second earlier: runs #200 and
# #202 failed with "Found 0 artifact(s)" 0.64 s and 0.46 s after the upload,
# while the passes in between had waited 0.66 to 0.71 s. The artifact was
# there all along (a re-run of #200 found it, beside its own), it simply was
# not listed yet. Reported upstream as actions/deploy-pages#451. The job
# boundary puts a runner start between the two, which is the layout GitHub's
# own Pages workflows use.
#
# If deploy still fails, use "Re-run failed jobs", which re-runs deploy alone
# against the artifact build already uploaded. Not "Re-run all jobs": that
# uploads a second artifact of the same name into the same run, and
# deploy-pages refuses a run with two (#200's re-run did exactly that).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
