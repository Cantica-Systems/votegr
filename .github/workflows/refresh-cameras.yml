# Keeps site/data/cameras.json current from OpenStreetMap.
#
# The page ships the camera list rather than fetching it, which is what lets
# the lookup and the route run without contacting anyone. The cost of that
# choice is that the shipped list goes stale unless something refreshes it,
# and "something" was a person remembering to run a script. This is that
# something.
#
# Daily. One query a day is a negligible load on Overpass, which is donated
# infrastructure, and it means a newly mapped reader reaches the page within a
# day rather than sitting unseen for most of a week. The first real run found
# four cameras the committed set did not have, which is the argument for the
# shorter interval: the list drifts faster than weekly checking would catch.
name: Refresh ALPR cameras

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: every cron job in the world
    # fires at :00, and Overpass is busiest exactly then.
    - cron: '17 6 * * *'
  workflow_dispatch:

# contents: write, to push the refreshed data back. The push is made with the
# deploy key, and a deploy-key push fires pages.yml like any push to main, so
# nothing here asks for the deploy.
permissions:
  contents: write

# Never let two refreshes overlap, and never cancel one halfway: a killed run
# between write and commit would leave the tree in a state nobody chose.
concurrency:
  group: refresh-cameras
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # ssh-key, not the default token: the push at the end of this job has to
      # be made by the DEPLOY KEY, because that is what the branch ruleset
      # bypasses. GitHub cannot grant the Actions app a ruleset bypass at all
      # (only installed apps qualify, and Actions is first-party), so the key
      # is the mechanism that lets this unattended job keep writing to a branch
      # that otherwise requires a pull request.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.CAMERAS_DEPLOY_KEY }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # No dependency install step: scripts/refresh_cameras.py is standard library
      # only, deliberately, so this job has no supply chain of its own.

      - name: Record the current count
        id: before
        run: |
          BEFORE=$(python3 -c "import json;print(len(json.load(open('site/data/cameras.json'))['cameras']))")
          echo "count=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "Committed set: $BEFORE cameras"

      - name: Pull from OpenStreetMap
        # The script walks an endpoint fallback chain, treats an Overpass
        # 'remark' at HTTP 200 as the truncation signal it is, and exits
        # non-zero rather than writing a partial result. A failure here stops
        # the job before anything is committed, which is the intended outcome.
        run: python3 scripts/refresh_cameras.py

      - name: Report the delta
        id: after
        # Printed, not enforced. A floor on how far the set may shrink cannot
        # tell a genuine removal from a truncated answer, so it holds back real
        # removals and latches the job red, and the page must show the LATEST
        # set. Completeness of the ANSWER is checked where it can be, in
        # refresh_cameras.py, which skips any Overpass reply carrying a
        # truncation 'remark' and refuses a result under MIN_CAMERAS=20. The
        # delta also goes in the commit subject, so a surprising one is seen.
        run: |
          BEFORE=${{ steps.before.outputs.count }}
          AFTER=$(python3 -c "import json;print(len(json.load(open('site/data/cameras.json'))['cameras']))")
          echo "count=$AFTER" >> "$GITHUB_OUTPUT"
          printf 'before=%d after=%d delta=%+d\n' "$BEFORE" "$AFTER" "$((AFTER - BEFORE))"

      - name: Commit if anything changed
        # The push is the deploy: made with the deploy key, it fires pages.yml
        # like any push to main. A push with the default token would not, since
        # GitHub fires no workflows for those.
        run: |
          if git diff --quiet -- site/data/cameras.json; then
            echo "No change since the last run. Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/cameras.json
          git commit -m "Refresh ALPR cameras from OpenStreetMap (${{ steps.before.outputs.count }} -> ${{ steps.after.outputs.count }})"
          git push
