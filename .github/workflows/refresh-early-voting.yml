# Keeps site/data/early-voting.json current from the Kent County clerk.
#
# Without a schedule the file is refreshed only when someone remembers, and
# it goes stale in the weeks after MCL 168.662 fixes the early voting sites
# for the next election, which is exactly when a voter needs it.
#
# Weekly, not daily like the cameras. The county publishes this a few times a
# year, in a burst once the 60-day deadline passes, so a daily run would be
# thirty times the requests on someone else's server to learn nothing. A week
# is well inside the gap between the county posting and a voter needing it.
#
# What this job does NOT do:
#
#   - It asks for no deploy. The deploy-key push fires pages.yml like any
#     push to main, which republishes site/ with this file changed, but
#     neither page loads early-voting.json (app.js takes graph, precincts,
#     addresses, polling, cameras, elections, landcover, neighbors, gr-clerk
#     and sources; /simple takes five of those), so what a reader sees does
#     not change.
#
#   - It does not geocode. The `located` coordinates beside each site come
#     from geocode_places.py, not from this script. Putting the refresh on a
#     schedule is what made that matter: an unattended weekly job that dropped
#     all thirty coordinates on every change is worse than no job at all, so
#     refresh_early_voting.py now carries them forward wherever the address
#     text is unchanged. What it cannot carry is a genuinely NEW site, which
#     has no coordinate to keep -- the count is reported below and named in
#     the commit when it falls. Chaining the geocoder here would close that
#     last gap and is deliberately not done: geocode_places.py also rewrites
#     all thirty site/data/polling/*.json files, which would turn a small data
#     refresh into a commit nobody can review. Run it by hand when sites move.
name: Refresh early voting

on:
  schedule:
    # 07:43 UTC on Tuesdays. Off the hour, and off the day and hour of the
    # other two scheduled jobs (cameras 06:17 daily, link check 06:30 Monday),
    # so a slow run never queues behind one of them.
    - cron: '43 7 * * 2'
  workflow_dispatch:

# contents: write, to push the refreshed file back.
permissions:
  contents: write

# Never let two refreshes overlap, and never cancel one halfway: a killed run
# between write and commit would leave the tree in a state nobody chose.
concurrency:
  group: refresh-early-voting
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # What the committed file describes, as step outputs. Run before and
      # after the refresh, so the two can be compared and the commit can say
      # what moved.
      DESCRIBE: |
        import json
        d = json.load(open('site/data/early-voting.json'))
        s = d.get('sites') or {}
        ev = d.get('early_voting') or {}
        print(f"election={d.get('election',{}).get('date','none')}")
        print(f"window={ev.get('from','?')}..{ev.get('to','?')}")
        print(f"sites={len(s)}")
        print(f"located={sum(1 for v in s.values() if v.get('located'))}")
    steps:
      # The deploy key, not the default token, for the same reason as
      # refresh-cameras.yml: the branch ruleset bypasses the key, and GitHub
      # cannot grant the Actions app a bypass at all. The key is repository
      # scoped rather than workflow scoped, so the camera job's key is the
      # right one to reuse; its name is now narrower than its job and worth
      # renaming to something like DATA_DEPLOY_KEY when convenient.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.CAMERAS_DEPLOY_KEY }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # No dependency install: refresh_early_voting.py and the archive helper
      # it imports are standard library only, so this job has no supply chain
      # of its own.

      - name: Record what the committed file describes
        id: before
        run: |
          python3 -c "$DESCRIBE" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Read the county and city pages
        # The script refuses rather than writing a partial or wrong result:
        # no election heading, no window sentence, a window ending after the
        # election it was inferred for, fewer sites than MIN_SITES, or a city
        # page it can no longer parse. Any of those exits non-zero and stops
        # the job before anything is committed, which is the intended outcome.
        #
        # It also prints the election and window it found, and says so plainly
        # when that election has already passed, which is the signal that the
        # file has gone stale.
        #
        # A DECLINED line is the other failure and means the opposite: the
        # page was never read, because something in front of it turned this
        # client away. Nothing is wrong with the data or the parser, and the
        # county's markup does not want looking at.
        #
        # Getting past a refusal would mean pretending to be a browser, which
        # this project does not do (scripts/check_links.mjs sets out the
        # reasoning). So a refusal leaves the run red, naming the reason,
        # until the publisher offers a feed or lets a named client through. A
        # red run that names the reason is the point; a green one that quietly
        # checked nothing is what this whole job exists to prevent.
        #
        # Since 2026-09-24 the county's edge answers 403 to this project, so
        # the scheduled run is expected red until that changes.
        env:
          # Optional. Without them archive.org declines most captures and the
          # provenance records that honestly instead of claiming a snapshot it
          # does not have. credentials() treats an unset or empty value as
          # absent, so an unconfigured repository degrades rather than breaks.
          ARCHIVE_S3_KEY: ${{ secrets.ARCHIVE_S3_KEY }}
          ARCHIVE_S3_SECRET: ${{ secrets.ARCHIVE_S3_SECRET }}
        run: python3 scripts/refresh_early_voting.py

      - name: Report what changed
        id: after
        run: |
          python3 -c "$DESCRIBE" >> "$GITHUB_OUTPUT"
          echo "before: ${{ steps.before.outputs.election }} ${{ steps.before.outputs.window }} ${{ steps.before.outputs.sites }} sites, ${{ steps.before.outputs.located }} geocoded"
          cat "$GITHUB_OUTPUT"

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- site/data/early-voting.json; then
            echo "The county page says what the committed file already says."
            exit 0
          fi
          BEFORE_EL='${{ steps.before.outputs.election }}'
          AFTER_EL='${{ steps.after.outputs.election }}'
          BEFORE_GEO='${{ steps.before.outputs.located }}'
          AFTER_GEO='${{ steps.after.outputs.located }}'
          SUBJECT="Refresh early voting from Kent County"
          if [ "$BEFORE_EL" != "$AFTER_EL" ]; then
            SUBJECT="$SUBJECT ($BEFORE_EL -> $AFTER_EL)"
          else
            SUBJECT="$SUBJECT ($AFTER_EL)"
          fi
          # Say it in the commit, not just the log. Coordinates are carried
          # forward for every site whose address text is unchanged, so a fall
          # here means the county published somewhere NEW -- which is both the
          # interesting case and the one wanting a human with the geocoder.
          BODY="Window ${{ steps.after.outputs.window }}, ${{ steps.after.outputs.sites }} jurisdictions."
          if [ "$AFTER_GEO" -lt "$BEFORE_GEO" ]; then
            BODY="$BODY

          Geocoded sites: $BEFORE_GEO -> $AFTER_GEO. Coordinates are carried
          forward where the address text is unchanged, so this fall means new
          or reworded locations. geocode_places.py fills them in; it is not
          run here because it also rewrites every site/data/polling/*.json."
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/early-voting.json
          git commit -m "$SUBJECT" -m "$BODY"
          git push
